<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090817">
    <meta
            name="description"
            content="Hello page"
    >

    <title>VatSenator</title>

    <style>
        :root {
            color-scheme: dark;
            --ink: #f8f7ff;
            --muted: rgba(238, 235, 255, 0.62);
            --line: rgba(255, 255, 255, 0.13);
            --glass: rgba(255, 255, 255, 0.07);
            --blue: #62a8ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100svh;
            overflow: hidden;
            color: var(--ink);

            background:
                    radial-gradient(
                            circle at 15% 20%,
                            rgba(86, 89, 255, 0.21),
                            transparent 31rem
                    ),
                    radial-gradient(
                            circle at 84% 80%,
                            rgba(222, 66, 255, 0.18),
                            transparent 32rem
                    ),
                    linear-gradient(
                            140deg,
                            #060611 0%,
                            #0d0920 45%,
                            #080b1f 100%
                    );

            font-family:
                    "Segoe UI Variable Display",
                    "Segoe UI",
                    Inter,
                    ui-sans-serif,
                    system-ui,
                    sans-serif;
        }

        body::before,
        body::after {
            position: fixed;
            z-index: -1;
            width: 34rem;
            height: 34rem;
            border-radius: 50%;
            content: "";
            filter: blur(70px);
            opacity: 0.48;
            animation: drift 14s ease-in-out infinite alternate;
            pointer-events: none;
        }

        body::before {
            top: -18rem;
            right: -8rem;
            background: #5c41dc;
        }

        body::after {
            bottom: -20rem;
            left: -6rem;
            background: #be398d;
            animation-delay: -7s;
        }

        .noise {
            position: fixed;
            inset: 0;
            z-index: -1;
            opacity: 0.035;

            background-image:
                    url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.7'/%3E%3C/svg%3E");

            pointer-events: none;
        }

        main {
            position: relative;
            display: grid;
            min-height: 100svh;
            place-items: center;
            padding: 2rem;
            isolation: isolate;
        }

        .monogram {
            position: absolute;
            z-index: -1;
            color: rgba(255, 255, 255, 0.018);
            font-size: clamp(24rem, 58vw, 54rem);
            font-weight: 800;
            line-height: 0.8;
            transform: translateY(2%);
            user-select: none;
        }

        .hero {
            width: min(58rem, 100%);
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 1rem;
            color: var(--muted);
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.28em;
            text-transform: uppercase;
            animation: rise 800ms 100ms both;
        }

        h1 {
            max-width: 12ch;
            margin: 0 auto;
            font-size: clamp(3.5rem, 10vw, 7.6rem);
            font-weight: 750;
            letter-spacing: -0.065em;
            line-height: 0.95;
            text-wrap: balance;
            animation: rise 900ms 180ms both;
        }

        h1 span {
            display: inline-block;
            padding-right: 0.07em;
            color: transparent;

            background: linear-gradient(
                    112deg,
                    #ffffff 10%,
                    #bbb5ff 45%,
                    #82baff 72%,
                    #ef9cdc 100%
            );

            background-clip: text;
            -webkit-background-clip: text;
        }

        .role {
            margin: 1.45rem 0 0;
            color: rgba(238, 235, 255, 0.68);
            font-size: clamp(1rem, 2.2vw, 1.22rem);
            font-weight: 500;
            letter-spacing: 0.16em;
            line-height: 1.5;
            animation: rise 900ms 260ms both;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 0.9rem;
            margin-top: 2.6rem;
            animation: rise 900ms 360ms both;
        }

        .social {
            position: relative;
            display: grid;
            width: 3.75rem;
            height: 3.75rem;
            place-items: center;
            color: rgba(255, 255, 255, 0.82);
            background: var(--glass);
            border: 1px solid var(--line);
            border-radius: 50%;

            box-shadow:
                    0 14px 40px rgba(0, 0, 0, 0.2),
                    inset 0 1px 0 rgba(255, 255, 255, 0.1);

            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);

            transition:
                    transform 220ms cubic-bezier(0.2, 0.75, 0.25, 1),
                    color 220ms ease,
                    background 220ms ease,
                    border-color 220ms ease,
                    box-shadow 220ms ease;
        }

        .social::after {
            position: absolute;
            top: calc(100% + 0.7rem);
            left: 50%;
            padding: 0.35rem 0.55rem;
            color: rgba(255, 255, 255, 0.78);
            background: rgba(6, 6, 17, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 0.45rem;
            content: attr(aria-label);
            font-size: 0.72rem;
            letter-spacing: 0.03em;
            opacity: 0;
            transform: translate(-50%, -0.25rem);
            transition: 180ms ease;
            pointer-events: none;
        }

        .social:hover,
        .social:focus-visible {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.13);
            border-color: rgba(192, 181, 255, 0.42);

            box-shadow:
                    0 18px 55px rgba(91, 63, 210, 0.28),
                    inset 0 1px 0 rgba(255, 255, 255, 0.18);

            transform: translateY(-0.35rem) scale(1.04);
        }

        .social:hover::after,
        .social:focus-visible::after {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .social:focus-visible {
            outline: 2px solid var(--blue);
            outline-offset: 4px;
        }

        .social svg {
            width: 1.45rem;
            height: 1.45rem;
            fill: currentColor;
        }

        .footer-mark {
            position: fixed;
            right: 1.5rem;
            bottom: 1.3rem;
            margin: 0;
            color: rgba(255, 255, 255, 0.24);
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(1.2rem);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes drift {
            from {
                transform: translate3d(-2rem, -1rem, 0) scale(0.94);
            }

            to {
                transform: translate3d(2rem, 2rem, 0) scale(1.08);
            }
        }

        @media (max-width: 38rem) {
            main {
                padding: 1.25rem;
            }

            h1 {
                font-size: clamp(3.25rem, 17vw, 5.25rem);
            }

            .links {
                margin-top: 2.5rem;
            }

            .social {
                width: 3.55rem;
                height: 3.55rem;
            }

            .footer-mark {
                right: 50%;
                transform: translateX(50%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<body>
<div class="noise" aria-hidden="true"></div>

<main>
    <div class="monogram" aria-hidden="true">V</div>

    <section class="hero" aria-labelledby="intro-title">
        <p class="eyebrow">--- W e l c o m e ---</p>

        <h1 id="intro-title">
            Hello, I am <span>VatSenator</span>
        </h1>

        <p class="role">Software Developer</p>

        <nav class="links" aria-label="Social links">
            <a
                    class="social"
                    href="https://github.com/VatSenator"
                    target="_blank"
                    rel="noreferrer"
                    aria-label="GitHub"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 .7A11.5 11.5 0 0 0 8.36 23.1c.58.1.79-.25.79-.56v-2.02c-3.23.7-3.91-1.37-3.91-1.37-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.04 1.77 2.72 1.26 3.38.96.1-.75.4-1.26.74-1.55-2.58-.3-5.29-1.29-5.29-5.69 0-1.26.45-2.28 1.19-3.09-.12-.29-.52-1.46.11-3.04 0 0 .97-.31 3.16 1.18a10.95 10.95 0 0 1 5.76 0c2.19-1.49 3.16-1.18 3.16-1.18.63 1.58.23 2.75.11 3.04.74.81 1.19 1.83 1.19 3.09 0 4.42-2.72 5.39-5.3 5.68.42.36.79 1.07.79 2.16v3.2c0 .31.21.67.8.56A11.5 11.5 0 0 0 12 .7Z"></path>
                </svg>
            </a>

            <a
                    class="social"
                    href="https://discord.com/"
                    target="_blank"
                    rel="noreferrer"
                    aria-label="Discord"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20.32 4.37A16 16 0 0 0 16.36 3l-.49 1a14.7 14.7 0 0 0-7.74 0l-.5-1a16.1 16.1 0 0 0-3.96 1.38C1.17 8.08.49 11.68.83 15.23a16.2 16.2 0 0 0 4.86 2.46l1.18-1.62a10.3 10.3 0 0 1-1.86-.9l.46-.36a11.55 11.55 0 0 0 13.06 0l.47.36c-.6.35-1.23.65-1.87.9l1.18 1.62a16.2 16.2 0 0 0 4.86-2.46c.4-4.11-.69-7.68-2.85-10.86ZM8.41 13.08c-.95 0-1.72-.87-1.72-1.94s.75-1.94 1.72-1.94 1.74.88 1.72 1.94c0 1.07-.76 1.94-1.72 1.94Zm7.18 0c-.95 0-1.72-.87-1.72-1.94s.75-1.94 1.72-1.94 1.73.88 1.72 1.94c0 1.07-.75 1.94-1.72 1.94Z"></path>
                </svg>
            </a>

            <a
                    class="social"
                    href="mailto:hello@vatsenator.me"
                    aria-label="Email"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M20 4H4a2.4 2.4 0 0 0-2.39 2.4v11.2A2.4 2.4 0 0 0 4 20h16a2.4 2.4 0 0 0 2.4-2.4V6.4A2.4 2.4 0 0 0 20 4Zm-.55 3.25-6.84 5.13a1 1 0 0 1-1.22 0L4.55 7.25A.75.75 0 1 1 5.45 6l6.55 4.91L18.55 6a.75.75 0 1 1 .9 1.25Z"></path>
                </svg>
            </a>
        </nav>
    </section>

    <p class="footer-mark">VatSenator © 2026</p>
</main>
</body>
</html>
